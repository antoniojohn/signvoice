{% extends "base.html" %}
{% block title %}Sign up - SignVoice{% endblock %}
{% block main_class %}auth-page{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Create your account</h1>
  <p class="subtitle">Every user builds their own private sign library.</p>
  <form method="POST">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" required autofocus>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required>
    {% if error %}<div class="error-msg">{{ error }}</div>{% endif %}
    <button type="submit" class="btn-primary btn-block">Create account</button>
  </form>
  <div class="auth-footer">Already registered? <a href="{{ url_for('login') }}">Log in</a></div>
</div>
{% endblock %}
